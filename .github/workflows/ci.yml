name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory
      PORT: 8080
      NODE_ENV: test
      SESSION_SECRET: ci-test-secret-not-real
      ADMIN_PIN: "1234"
      # OpenAI is not exercised in CI — scan endpoint tests are skipped
      OPENAI_API_KEY: sk-not-real-for-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (libs)
        run: pnpm run typecheck:libs

      - name: Typecheck (all)
        run: pnpm run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Push DB schema
        run: pnpm --filter @workspace/db run push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory

      - name: Health check (API server starts)
        run: |
          node --enable-source-maps artifacts/api-server/dist/index.mjs &
          API_PID=$!
          sleep 4
          curl -sf http://localhost:8080/api/healthz || (kill $API_PID; exit 1)
          kill $API_PID
