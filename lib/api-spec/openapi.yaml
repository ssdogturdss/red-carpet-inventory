openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Chemical Inventory API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: User authentication
  - name: admin
    description: Admin operations
  - name: stores
    description: Store operations
  - name: chemicals
    description: Chemical operations
  - name: inventory
    description: Inventory count operations
  - name: alerts
    description: Alert operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/auth:
    post:
      operationId: adminAuth
      tags: [admin]
      summary: Validate admin PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAuthBody"
      responses:
        "200":
          description: Auth result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResult"

  /auth/users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List active employees (public — for login picker)
      responses:
        "200":
          description: List of active users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserPublic"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Log in with user ID and 4-digit PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current logged-in user (requires x-user-token header)
      parameters:
        - name: x-user-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Log out (clears session token)
      parameters:
        - name: x-user-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List all users (requires admin PIN header)
      parameters:
        - name: x-admin-pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAdmin"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create a new employee (requires admin PIN header)
      parameters:
        - name: x-admin-pin
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAdmin"

  /admin/users/{userId}:
    put:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update an employee (requires admin PIN header)
      parameters:
        - name: x-admin-pin
          in: header
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAdmin"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete an employee (requires admin PIN header)
      parameters:
        - name: x-admin-pin
          in: header
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /admin/bot-settings:
    get:
      operationId: getBotSettings
      tags: [admin]
      summary: Get bot personalization settings (requires admin PIN header)
      parameters:
        - name: x-admin-pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"
    put:
      operationId: updateBotSettings
      tags: [admin]
      summary: Update bot personalization settings (requires admin PIN header)
      parameters:
        - name: x-admin-pin
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBotSettingsBody"
      responses:
        "200":
          description: Updated bot settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSettings"

  /bot-settings/public:
    get:
      operationId: getPublicBotSettings
      tags: [admin]
      summary: Get public bot name and greeting (no PIN required)
      responses:
        "200":
          description: Public bot settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBotSettings"

  /stores:
    get:
      operationId: getStores
      tags: [stores]
      summary: List all stores
      responses:
        "200":
          description: List of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      tags: [stores]
      summary: Create a new store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoreBody"
      responses:
        "201":
          description: Created store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"

  /stores/{storeId}:
    patch:
      operationId: updateStore
      tags: [stores]
      summary: Update a store
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoreBody"
      responses:
        "200":
          description: Updated store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
    delete:
      operationId: deleteStore
      tags: [stores]
      summary: Delete a store and all its data
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /chemicals:
    get:
      operationId: getChemicals
      tags: [chemicals]
      summary: List all chemicals
      responses:
        "200":
          description: List of chemicals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chemical"

  /chemicals/{chemicalId}:
    patch:
      operationId: updateChemical
      tags: [chemicals]
      summary: Update a chemical/product
      parameters:
        - name: chemicalId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChemicalBody"
      responses:
        "200":
          description: Updated chemical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chemical"
    delete:
      operationId: deleteChemical
      tags: [chemicals]
      summary: Delete a chemical/product
      parameters:
        - name: chemicalId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /inventory:
    get:
      operationId: getInventoryCounts
      tags: [inventory]
      summary: List inventory counts
      parameters:
        - name: storeId
          in: query
          schema:
            type: integer
        - name: weekOf
          in: query
          schema:
            type: string
            description: ISO date string for the week (YYYY-MM-DD, Monday)
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of inventory counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryCount"
    post:
      operationId: submitInventoryCount
      tags: [inventory]
      summary: Submit a weekly inventory count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInventoryCountBody"
      responses:
        "201":
          description: Count submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCount"

  /inventory/{countId}:
    get:
      operationId: getInventoryCount
      tags: [inventory]
      summary: Get a single inventory count
      parameters:
        - name: countId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inventory count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryCount"
    patch:
      operationId: updateInventoryCount
      tags: [inventory]
      summary: Update notes or submittedBy on a count
      parameters:
        - name: countId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryCountBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
    delete:
      operationId: deleteInventoryCount
      tags: [inventory]
      summary: Delete an inventory count and its entries
      parameters:
        - name: countId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /inventory/scan:
    post:
      operationId: scanInventorySheet
      tags: [inventory]
      summary: Upload photo of paper count sheet and extract counts via AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInventorySheetBody"
      responses:
        "200":
          description: Extracted inventory counts from the photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanInventorySheetResult"

  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: List alerts
      parameters:
        - name: storeId
          in: query
          schema:
            type: integer
        - name: acknowledged
          in: query
          schema:
            type: boolean
        - name: weekOf
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/summary:
    get:
      operationId: getAlertsSummary
      tags: [alerts]
      summary: Get alert counts grouped by store and severity
      responses:
        "200":
          description: Alert summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsSummary"

  /alerts/{alertId}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete an alert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /alerts/{alertId}/acknowledge:
    patch:
      operationId: acknowledgeAlert
      tags: [alerts]
      summary: Acknowledge an alert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: List chemical orders
      parameters:
        - name: storeId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: chemicalId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChemicalOrder"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new chemical order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "200":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChemicalOrder"

  /orders/{orderId}:
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update an order (status, notes, etc.)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChemicalOrder"
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /received:
    get:
      operationId: getReceived
      tags: [received]
      summary: List inventory received records
      parameters:
        - name: storeId
          in: query
          schema:
            type: integer
        - name: chemicalId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of received records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryReceived"
    post:
      operationId: logReceived
      tags: [received]
      summary: Log an inventory receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReceivedBody"
      responses:
        "200":
          description: Created received record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReceived"

  /received/{receivedId}:
    delete:
      operationId: deleteReceived
      tags: [received]
      summary: Delete a received record
      parameters:
        - name: receivedId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /pulls:
    get:
      operationId: getPulls
      tags: [pulls]
      summary: List chemical pull-to-online log entries
      parameters:
        - name: storeId
          in: query
          schema:
            type: integer
        - name: chemicalId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of pull log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChemicalPull"
    post:
      operationId: logPull
      tags: [pulls]
      summary: Log a chemical pulled to online
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePullBody"
      responses:
        "200":
          description: Created pull log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChemicalPull"

  /pulls/{pullId}:
    delete:
      operationId: deletePull
      tags: [pulls]
      summary: Delete a pull log entry
      parameters:
        - name: pullId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /on-hand:
    get:
      operationId: getOnHand
      tags: [inventory]
      summary: Get current on-hand quantities for a store
      parameters:
        - name: storeId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: On-hand inventory for the store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnHandResult"

  /on-hand/adjust:
    patch:
      operationId: adjustOnHand
      tags: [inventory]
      summary: Manually adjust on-hand quantity for a chemical at a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId, chemicalId, quantity]
              properties:
                storeId:
                  type: integer
                chemicalId:
                  type: integer
                quantity:
                  type: number
                unit:
                  type: string
      responses:
        "200":
          description: Adjustment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnHandEntry"

  /reports/chemicals:
    get:
      operationId: getChemicalReport
      tags: [reports]
      summary: Usage comparison for all chemicals across all stores
      parameters:
        - name: weekOf
          in: query
          required: false
          schema:
            type: string
            description: ISO date (YYYY-MM-DD) — defaults to latest per store
      responses:
        "200":
          description: List of chemicals each with per-store latest count data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChemicalReport"

  /reports/store/{storeId}:
    get:
      operationId: getStoreReport
      tags: [reports]
      summary: All chemicals for a single store with week-over-week change
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
        - name: weekOf
          in: query
          required: false
          schema:
            type: string
            description: ISO date (YYYY-MM-DD) — defaults to latest count
      responses:
        "200":
          description: Store report with per-chemical quantities and changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreReport"

  /reports/missing-submissions:
    get:
      operationId: getMissingSubmissions
      tags: [reports]
      summary: Stores that have not submitted a count for the current week
      responses:
        "200":
          description: List of stores missing this week's count
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissingSubmission"

  /notifications/contacts:
    get:
      operationId: getNotificationContacts
      tags: [notifications]
      summary: List all email notification contacts
      parameters:
        - name: storeId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationContact"
    post:
      operationId: createNotificationContact
      tags: [notifications]
      summary: Add a new email contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationContactBody"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationContact"

  /notifications/contacts/{id}:
    patch:
      operationId: updateNotificationContact
      tags: [notifications]
      summary: Update an email contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationContactBody"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationContact"
    delete:
      operationId: deleteNotificationContact
      tags: [notifications]
      summary: Remove an email contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: integer
                required: [success, id]

  /notifications/contacts/{id}/test:
    post:
      operationId: testNotificationContact
      tags: [notifications]
      summary: Send a test notification (email and/or SMS) to a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Result of test send
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                    nullable: true
                required: [success]

  /notifications/status:
    get:
      operationId: getNotificationStatus
      tags: [notifications]
      summary: Check if email and SMS are configured
      responses:
        "200":
          description: Notification configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                  emailConfigured:
                    type: boolean
                  smsConfigured:
                    type: boolean
                required: [configured, emailConfigured, smsConfigured]

  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register or update a device push token (upsert by token value)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                platform:
                  type: string
                label:
                  type: string
                minSeverity:
                  type: string
              required: [token]
      responses:
        "200":
          description: Token updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushToken"
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushToken"

  /push-tokens/{token}:
    delete:
      operationId: unregisterPushToken
      tags: [notifications]
      summary: Remove a device push token registration
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /admin/push-tokens:
    get:
      operationId: getAdminPushTokens
      tags: [admin]
      summary: List all registered push notification devices (requires admin PIN header)
      parameters:
        - name: x-admin-pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of registered push tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PushToken"

  /admin/push-tokens/{tokenId}:
    delete:
      operationId: deleteAdminPushToken
      tags: [admin]
      summary: Delete a registered push token (requires admin PIN header)
      parameters:
        - name: x-admin-pin
          in: header
          required: true
          schema:
            type: string
        - name: tokenId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /admin/push-receipts:
    get:
      operationId: getAdminPushReceipts
      tags: [admin]
      summary: List push delivery receipts (requires admin PIN header)
      parameters:
        - name: x-admin-pin
          in: header
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, ok, error]
      responses:
        "200":
          description: List of push delivery receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PushReceipt"

